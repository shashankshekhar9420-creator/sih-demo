name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Setup Databases & Prisma Clients
        run: npm run db:setup

      - name: Run Root Integration Tests
        run: npm test

      - name: Run Commerce Static Checks
        run: node apps/commerce/tests/static.test.mjs

      - name: Run Artisan Backend Tests
        run: node --import tsx --test apps/artisan/lib/backend.test.ts

      - name: Build All Next.js Applications
        run: npm run build
